<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Samiullah - CS student building backend stuff in Python" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#7CF5C3"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect class="reveal" x="60" y="140" width="0" height="40"/>
    </clipPath>
    <style>
      .name { font: 700 58px 'Segoe UI', Arial, sans-serif; fill: url(#tg); animation: fadeUp 1s ease-out both; }
      .hi   { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #9fd8ef; animation: fadeUp 1s ease-out both; }
      .sub  { font: 500 22px 'Courier New', monospace; fill: #e6f4fa; }
      .chip { fill: rgba(54,188,247,0.15); stroke: #36BCF7; stroke-width: 1; }
      .chipt{ font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #cfe8f3; }
      .code { font: 700 120px 'Courier New', monospace; fill: rgba(255,255,255,0.05); }
      .reveal { animation: reveal 2.6s steps(43) 0.8s forwards; }
      .cursor { animation: move 2.6s steps(43) 0.8s forwards, blink 0.9s step-end 0.8s infinite; }
      .orb1 { animation: float 6s ease-in-out infinite; }
      .orb2 { animation: float 8s ease-in-out infinite reverse; }
      .orb3 { animation: float 7s ease-in-out 1s infinite; }
      .chips { animation: fadeUp 1s ease-out 3.2s both; }
      @keyframes reveal { from { width: 0 } to { width: 600px } }
      @keyframes move   { from { transform: translateX(0) } to { transform: translateX(568px) } }
      @keyframes blink  { 50% { opacity: 0 } }
      @keyframes float  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    </style>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>

  <text class="code" x="600" y="190">&lt;/&gt;</text>
  <circle class="orb1" cx="780" cy="60" r="38" fill="#36BCF7" opacity="0.18"/>
  <circle class="orb2" cx="840" cy="200" r="22" fill="#7CF5C3" opacity="0.2"/>
  <circle class="orb3" cx="690" cy="215" r="12" fill="#36BCF7" opacity="0.25"/>

  <text class="hi" x="60" y="62">Hi, I'm</text>
  <text class="name" x="60" y="118">Samiullah</text>

  <text class="sub" x="60" y="165" clip-path="url(#reveal)">CS student building backend stuff in Python</text>
  <rect class="cursor" x="60" y="146" width="3" height="26" fill="#7CF5C3"/>

  <g class="chips">
    <rect class="chip" x="60"  y="195" width="76"  height="28" rx="14"/>
    <text class="chipt" x="98"  y="214" text-anchor="middle">Python</text>
    <rect class="chip" x="146" y="195" width="88"  height="28" rx="14"/>
    <text class="chipt" x="190" y="214" text-anchor="middle">FastAPI</text>
    <rect class="chip" x="244" y="195" width="108" height="28" rx="14"/>
    <text class="chipt" x="298" y="214" text-anchor="middle">SQLAlchemy</text>
    <rect class="chip" x="362" y="195" width="60"  height="28" rx="14"/>
    <text class="chipt" x="392" y="214" text-anchor="middle">JWT</text>
  </g>
</svg>
