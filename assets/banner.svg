<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Samiullah - Command Terminal Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#112a3a"/>
      <stop offset="100%" stop-color="#1b3b52"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="400" rx="16" fill="url(#bg)"/>
  <rect width="900" height="400" rx="16" fill="url(#grid)"/>

  <!-- Centered Expanded Terminal Window -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="780" height="320" rx="12" fill="#0a0f1a" stroke="#2b4560" stroke-width="1.5"/>
    <path d="M0 12a12 12 0 0 1 12-12h756a12 12 0 0 1 12 12v32H0z" fill="#14202f"/>
    <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="28" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="28" r="6" fill="#27c93f"/>
    <text x="390" y="33" fill="#6b8299" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" text-anchor="middle">samiullah@backend — zsh</text>

    <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" transform="translate(0, 15)">
      <text x="32" y="75">
        <tspan fill="#5eead4">samiullah@backend:~$</tspan>
        <tspan fill="#e2e8f0"> uvicorn main:app --reload</tspan>
      </text>
      
      <text x="32" y="115" fill="#4ade80">INFO:     Uvicorn running on http://127.0.0.1:8000</text>
      
      <text x="32" y="155" fill="#4ade80">INFO:     Application startup complete.</text>
      
      <text x="32" y="195">
        <tspan fill="#5eead4">samiullah@backend:~$</tspan>
        <tspan fill="#e2e8f0"> curl localhost:8000/api/learning</tspan>
      </text>
      
      <text x="32" y="235" fill="#fbbf24">{"status": "success", "message": "Backend developer skills loaded!"}</text>

      <text x="32" y="275">
        <tspan fill="#5eead4">samiullah@backend:~$</tspan>
      </text>

      <!-- Cursor -->
      <rect x="235" y="261" width="10" height="17" fill="#5eead4"/>
    </g>
  </g>
</svg>
