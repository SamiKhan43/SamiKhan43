<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Samiullah - Command Terminal Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#112a3a"/>
      <stop offset="100%" stop-color="#1b3b52"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="c1"><rect x="0" y="0" height="300" width="0"><animate attributeName="width" from="0" to="1200" dur="1.2s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="0" height="300" width="0"><animate attributeName="width" from="0" to="1200" dur="0.8s" begin="1.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="0" height="300" width="0"><animate attributeName="width" from="0" to="1200" dur="1.0s" begin="2.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="0" height="300" width="0"><animate attributeName="width" from="0" to="1200" dur="1.2s" begin="4.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="0" height="300" width="0"><animate attributeName="width" from="0" to="1200" dur="1.2s" begin="5.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <!-- Centered Expanded Terminal Window -->
  <g transform="translate(100, 20)">
    <rect x="0" y="0" width="1000" height="260" rx="12" fill="#0a0f1a" stroke="#2b4560" stroke-width="1.5"/>
    <path d="M0 12a12 12 0 0 1 12-12h976a12 12 0 0 1 12 12v28H0z" fill="#14202f"/>
    <circle cx="28" cy="26" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="26" r="6" fill="#27c93f"/>
    <text x="500" y="31" fill="#6b8299" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" text-anchor="middle">samiullah@backend — zsh</text>

    <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" transform="translate(0, 10)">
      <g clip-path="url(#c1)">
        <text x="32" y="70">
          <tspan fill="#5eead4">samiullah@backend:~$</tspan>
          <tspan fill="#e2e8f0"> uvicorn main:app --reload</tspan>
        </text>
      </g>
      <g clip-path="url(#c2)">
        <text x="32" y="105" fill="#4ade80">INFO:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)</text>
      </g>
      <g clip-path="url(#c3)">
        <text x="32" y="140" fill="#4ade80">INFO:     Application startup complete.</text>
      </g>
      <g clip-path="url(#c4)">
        <text x="32" y="175">
          <tspan fill="#5eead4">samiullah@backend:~$</tspan>
          <tspan fill="#e2e8f0"> curl localhost:8000/api/learning</tspan>
        </text>
      </g>
      <g clip-path="url(#c5)">
        <text x="32" y="210" fill="#fbbf24">{"status": "success", "message": "Backend developer skills loaded!"}</text>
      </g>

      <!-- Cursor -->
      <rect x="32" y="222" width="10" height="18" fill="#5eead4">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
